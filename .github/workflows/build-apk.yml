name: Build Geologist APK

# Inajenga APK ya debug kwenye server za GitHub (cloud) — hakuna Android Studio inayohitajika.
# Inajiendesha kila unapo-push, AU kwa mkono (tab ya "Actions" -> "Run workflow").

on:
  workflow_dispatch:      # kitufe cha "Run workflow" kwenye GitHub
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Chukua code
        uses: actions/checkout@v4

      - name: Sakinisha Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sakinisha Android SDK (na kukubali leseni)
        uses: android-actions/setup-android@v3

      - name: Andaa Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Jenga APK ya debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Pakia APK (artifact ya kupakua)
        uses: actions/upload-artifact@v4
        with:
          name: geologist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
