<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geologist by Khamis Suleiman</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232d4a2b'/%3E%3Cpolygon points='50,18 82,44 50,86 18,44' fill='%23ffd400'/%3E%3Cpolygon points='32,31 68,31 82,44 18,44' fill='%23ffe678'/%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/leaflet.css"/>
<style>
  :root{--accent:#3d6b39;--dark:#2d4a2b;--hi:#B3261E;--md:#E4761B;--gold:#ffd400;--muted:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:system-ui,Roboto,Segoe UI,sans-serif;background:#000;color:var(--dark)}
  #map{position:absolute;inset:0;z-index:1}
  /* Upau wa juu */
  #bar{position:absolute;top:0;left:0;right:0;z-index:1000;background:linear-gradient(180deg,rgba(45,74,43,.97),rgba(45,74,43,.82));color:#fff;padding:8px 12px}
  #bar .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #bar .logo{font-weight:800;font-size:1.05rem}
  #bar .logo span{color:var(--gold)}
  .modebtns{display:flex;gap:6px;margin-left:auto}
  .modebtns button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:18px;font-size:.85rem;cursor:pointer;font-weight:600}
  .modebtns button.on{background:#fff;color:var(--accent)}
  #ctx{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #ctx button,.chip{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);padding:5px 11px;border-radius:15px;font-size:.8rem;cursor:pointer}
  #ctx button.on{background:#fff;color:var(--accent);font-weight:700}
  #ctx .act{background:var(--gold);color:#000;font-weight:700;border:none}
  #ctx .danger{background:var(--hi);border:none}
  /* Paneli ya chini */
  #panel{position:absolute;left:10px;bottom:12px;z-index:1000;background:rgba(255,255,255,.96);border-radius:12px;padding:12px 14px;font-size:.82rem;max-width:270px;box-shadow:0 3px 12px rgba(0,0,0,.4);max-height:56vh;overflow:auto}
  #panel h4{color:var(--accent);font-size:.95rem;margin-bottom:4px}
  #panel .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;cursor:pointer}
  #panel .row:hover{color:var(--hi)}
  .pill{display:inline-block;color:#fff;border-radius:5px;padding:0 6px;font-weight:700;font-size:.74rem}
  .big{font-size:1.5rem;font-weight:800;color:var(--accent)}
  .legend{position:absolute;right:10px;bottom:12px;z-index:1000;background:rgba(255,255,255,.95);border-radius:9px;padding:8px 10px;font-size:.72rem;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  /* Dirisha la kuandika coords */
  #coordbox{position:absolute;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
  #coordbox .inner{background:#fff;border-radius:14px;padding:16px;width:min(92%,440px)}
  #coordbox h3{color:var(--accent);margin-bottom:8px}
  #coordbox textarea{width:100%;height:150px;font-family:ui-monospace,Consolas,monospace;font-size:13px;border:1px solid #bbb;border-radius:8px;padding:8px}
  #coordbox .b{display:flex;gap:8px;margin-top:10px}
  #coordbox button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
  #coordbox .ok{background:var(--accent);color:#fff}#coordbox .cancel{background:#eee}
  .note{position:absolute;left:290px;right:150px;bottom:2px;z-index:900;text-align:center;color:#fff;font-size:.64rem;opacity:.5;pointer-events:none}
  .leaflet-control-zoom a{width:40px;height:40px;line-height:40px;font-size:22px;font-weight:700;color:var(--accent)}
  .leaflet-control-zoom{margin-bottom:80px !important}
  .ptlabel{background:var(--hi);color:#fff;border:none;font-weight:700;font-size:11px;padding:1px 5px;border-radius:8px}
  @media(max-width:560px){.note{display:none}#panel{max-width:200px;font-size:.78rem}}
  /* Sidebar ya historia (kutoka backend) */
  #backdrop{position:absolute;inset:0;z-index:1490;background:rgba(0,0,0,.35);display:none}
  #backdrop.open{display:block}
  #sidebar{position:absolute;top:0;left:0;bottom:0;width:300px;max-width:85vw;z-index:1600;background:#fff;
    box-shadow:2px 0 14px rgba(0,0,0,.4);transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column}
  #sidebar.open{transform:none}
  #sidebar .sbhead{background:var(--dark);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}
  #sidebar .sbhead h3{font-size:1rem;flex:1;margin:0}
  #sidebar .sbclose{cursor:pointer;font-size:1.2rem;line-height:1}
  #sbstatus{font-size:.7rem;padding:5px 12px;border-bottom:1px solid #eee}
  #sblist{flex:1;overflow:auto;padding:6px 12px}
  .sbitem{border-bottom:1px solid #eee;padding:8px 0}
  .sbitem .nm{font-weight:700}
  .sbitem .mt{font-size:.7rem;color:var(--muted)}
  .sbitem .pill{margin:4px 4px 0 0;padding:2px 8px;cursor:pointer;display:inline-block}
  /* Splash ya kufungua */
  #splash{position:absolute;inset:0;z-index:3000;background:linear-gradient(135deg,#3d6b39,#2d4a2b);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:10px;transition:opacity .6s}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .st{font-size:2.1rem;font-weight:800;letter-spacing:1px}
  #splash .st span{color:#ffd400}
  #splash .sb{font-size:1.02rem;opacity:.92}
  #bar .by{font-size:.62rem;opacity:.85;margin-left:2px;white-space:nowrap}
</style>
</head>

function color(s){return s>=0.9?'#B3261E':s>=0.85?'#E4761B':'#3d6b39';}
function hv(a1,o1,a2,o2){const R=6371,r=d=>d*Math.PI/180;const dA=r(a2-a1),dO=r(o2-o1);
  const x=Math.sin(dA/2)**2+Math.cos(r(a1))*Math.cos(r(a2))*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function commoditiesAt(lat,lon){
  const rk=BELTS.map(b=>({b,d:hv(lat,lon,b.lat,b.lon)})).sort((x,y)=>x.d-y.d);
  const within=rk.filter(x=>x.d<=x.b.r).map(x=>x.b);
  return {commod:[...new Set((within.length?within:[rk[0].b]).flatMap(b=>b.c))],
          within,nearest:rk.slice(0,3).map(x=>({...x.b,dist:x.d}))};
}

// ---------- MODE: PIMA & CHUNGUZA ----------
const DMS=/(\d+(?:\.\d+)?)\s*[°:\s]\s*(\d+(?:\.\d+)?)\s*['′:\s]\s*(\d+(?:\.\d+)?)\s*["″]?\s*([NSEWnsew])/g;
const DECH=/(-?\d+\.\d+)\s*([NSEWnsew])/g, DEC=/(-?\d+\.\d+)/g;
function parseScalars(t){const pos=[],dm=[];let m;DMS.lastIndex=0;
  while((m=DMS.exec(t))){let v=+m[1]+ +m[2]/60 + +m[3]/3600;const h=m[4].toUpperCase();if(h==='S'||h==='W')v=-v;pos.push([m.index,v]);dm.push([m.index,m.index+m[0].length]);}
  const inD=i=>dm.some(r=>i>=r[0]&&i<r[1]);DECH.lastIndex=0;
  while((m=DECH.exec(t))){if(inD(m.index))continue;let v=+m[1];const h=m[2].toUpperCase();if(h==='S'||h==='W')v=-Math.abs(v);pos.push([m.index,v]);}
  if(pos.length===0){DEC.lastIndex=0;while((m=DEC.exec(t)))pos.push([m.index,+m[1]]);}
  return pos.sort((a,b)=>a[0]-b[0]).map(p=>p[1]);}
function areaPerim(pts){const a=6378137,f=1/298.257223563,e2=2*f-f*f,r=d=>d*Math.PI/180,n=pts.length;
  const la0=pts.reduce((s,p)=>s+p[0],0)/n,lo0=pts.reduce((s,p)=>s+p[1],0)/n;
  const s=Math.sin(r(la0)),w=1-e2*s*s,M=a*(1-e2)/Math.pow(w,1.5),N=a/Math.sqrt(w);
  const xy=pts.map(([la,lo])=>[N*Math.cos(r(la0))*r(lo-lo0),M*r(la-la0)]);let ar=0,pe=0;
  for(let i=0;i<n;i++){const[x1,y1]=xy[i],[x2,y2]=xy[(i+1)%n];ar+=x1*y2-x2*y1;pe+=Math.hypot(x2-x1,y2-y1);}
  return {area:Math.abs(ar/2),perim:pe};}
const FT=3.280839895, FT2=10.7639104, AC=4046.8564224;
// Vipimo vya eneo kwa vipimo vyote
function areaUnits(m2){
  return (m2/10000).toFixed(4)+' ha &nbsp;·&nbsp; '+m2.toLocaleString(undefined,{maximumFractionDigits:0})+' m² &nbsp;·&nbsp; '+
         (m2/AC).toFixed(3)+' ekari &nbsp;·&nbsp; '+(m2*FT2).toLocaleString(undefined,{maximumFractionDigits:0})+' ft²';
}
// Urefu x upana (bounding box) kwa mita na futi
function dims(pts){
  const a=6378137,f=1/298.257223563,e2=2*f-f*f,rad=d=>d*Math.PI/180;
  const lats=pts.map(p=>p[0]), lons=pts.map(p=>p[1]);
  const la0=(Math.min(...lats)+Math.max(...lats))/2, s=Math.sin(rad(la0)), w=1-e2*s*s;
  const M=a*(1-e2)/Math.pow(w,1.5), N=a/Math.sqrt(w);
  return { w:Math.abs(N*Math.cos(rad(la0))*rad(Math.max(...lons)-Math.min(...lons))),
           h:Math.abs(M*rad(Math.max(...lats)-Math.min(...lats))) };
}
function fmtDims(pts){ const d=dims(pts);
  return '≈ '+Math.round(d.w)+' m × '+Math.round(d.h)+' m &nbsp;('+Math.round(d.w*FT)+' ft × '+Math.round(d.h*FT)+' ft)'; }
function ptsList(pts){
  return '<div style="max-height:96px;overflow:auto;font-family:ui-monospace,monospace;font-size:.7rem;margin-top:4px;background:#f4f4ef;border-radius:6px;padding:5px">'+
    pts.map((p,i)=>'P'+(i+1)+': '+p[0].toFixed(6)+', '+p[1].toFixed(6)).join('<br>')+'</div>'; }

// Ripoti ya PDF ya eneo (client-side, jsPDF) — inatolewa na kupakuliwa/kusaviwa
function buildAreaPdf(name, silent){
  if(aoiPts.length<3){ if(!silent) alert('Pima eneo kwanza (pembe 3+).'); return; }
  if(!(window.jspdf && window.jspdf.jsPDF)){ if(!silent) alert('Ripoti ya PDF inahitaji internet mara ya kwanza (jsPDF). Jaribu ukiwa mtandaoni.'); return; }
  const r=areaPerim(aoiPts), d=dims(aoiPts);
  const clat=aoiPts.reduce((s,p)=>s+p[0],0)/aoiPts.length, clon=aoiPts.reduce((s,p)=>s+p[1],0)/aoiPts.length;
  const g=commoditiesAt(clat,clon);
  const nm=name||'Eneo';
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}); let y=16;
  doc.setFontSize(16); doc.setTextColor(61,107,57); doc.text('GEOLOGIST — Ripoti ya Eneo', 14, y); y+=8;
  doc.setFontSize(11); doc.setTextColor(40,40,40);
  doc.text('Jina: '+nm, 14, y); y+=6;
  doc.text('Tarehe: '+new Date().toLocaleString(), 14, y); y+=6;
  doc.text('Kituo (centroid): '+clat.toFixed(6)+', '+clon.toFixed(6), 14, y); y+=9;
  doc.setFontSize(13); doc.setTextColor(61,107,57); doc.text('Ukubwa wa eneo', 14, y); y+=6;
  doc.setFontSize(11); doc.setTextColor(40,40,40);
  doc.text((r.area/10000).toFixed(4)+' hekta   |   '+Math.round(r.area).toLocaleString()+' m2', 14, y); y+=6;
  doc.text((r.area/AC).toFixed(3)+' ekari   |   '+Math.round(r.area*FT2).toLocaleString()+' ft2', 14, y); y+=6;
  doc.text('Vipimo: '+Math.round(d.w)+' m x '+Math.round(d.h)+' m  ('+Math.round(d.w*FT)+' ft x '+Math.round(d.h*FT)+' ft)', 14, y); y+=6;
  doc.text('Mzunguko: '+(r.perim/1000).toFixed(3)+' km ('+Math.round(r.perim)+' m)', 14, y); y+=9;
  doc.setFontSize(13); doc.setTextColor(61,107,57); doc.text('Uchunguzi wa madini (kikanda)', 14, y); y+=6;
  doc.setFontSize(11); doc.setTextColor(40,40,40);
  doc.text('Madini yanayowezekana: '+(g.commod.join(', ')||'-'), 14, y, {maxWidth:182}); y+=6;

}

// ---------- MODE: GPS SURVEY (tembea mpaka) ----------

       '<div style="font-size:.78rem;margin-top:2px"><b>Vipimo:</b> '+fmtDims(aoiPts)+'</div>'+
       '<div style="font-size:.78rem">Mzunguko: '+(r.perim/1000).toFixed(3)+' km</div>';
  } else h+='<div style="font-size:.8rem;color:#555">Kona zilizorekodiwa: '+aoiPts.length+' (zinahitajika 3+).</div>';

  if(aoiPts.length>=3) h+='<div class="pill" style="background:var(--accent);margin-top:7px;padding:5px 10px;cursor:pointer;display:inline-block" onclick="analyze()">⛏️ Chunguza madini</div>'+
    ' <div class="pill" style="background:#1560d8;margin-top:7px;padding:5px 10px;cursor:pointer;display:inline-block" onclick="saveCurrent()">💾 Hifadhi</div>'+
    ' <div class="pill" style="background:#7a5c00;margin-top:7px;padding:5px 10px;cursor:pointer;display:inline-block" onclick="buildAreaPdf(\'Eneo\')">📄 PDF</div>';

// GPS IMARA: inachukua visomo vingi, inashika chenye USAHIHI BORA, inasubiri fix nzuri.
let gpsWatch=null;
function captureGps(){
  if(!navigator.geolocation){ renderGps('GPS haipatikani kwenye kifaa/browser hii. Tumia app ya Android.'); return; }
  if(gpsWatch!=null){ return; }  // tayari inasoma
  let best=null, n=0; const TARGET=8, MAXMS=10000, t0=Date.now();
  renderGps('📡 Inasoma GPS… simama TULI. Inasubiri usahihi mzuri (±'+TARGET+' m).');
  function finish(){
    if(gpsWatch!=null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; }
    if(!best){ renderGps('❌ GPS haikupata nafasi. Nenda eneo wazi (nje), ruhusu location, jaribu tena.'); return; }
    aoiPts.push([best.lat,best.lon]); gpsAcc.push(best.acc); redrawAoi();
    map.setView([best.lat,best.lon], Math.max(map.getZoom(),17));
    const q = best.acc<=TARGET ? 'NZURI' : 'ya wastani';
    renderGps('✓ Kona '+aoiPts.length+' imerekodiwa — usahihi '+q+' ±'+Math.round(best.acc)+' m (kutoka visomo '+n+').');
  }
  gpsWatch=navigator.geolocation.watchPosition(
    pos=>{ const c=pos.coords; n++;
      if(!best || (c.accuracy||9999) < best.acc) best={lat:c.latitude,lon:c.longitude,acc:c.accuracy||9999};
      renderGps('📡 Inasoma… visomo '+n+', usahihi bora ±'+Math.round(best.acc)+' m. (Endelea kusimama tuli)');
      if(best.acc<=TARGET || Date.now()-t0>MAXMS) finish();
    },
    err=>{ if(gpsWatch!=null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;}
      renderGps('❌ GPS imeshindwa: '+err.message+'. Ruhusu location. (Browser inahitaji HTTPS; vinginevyo tumia app ya Android.)'); },
    {enableHighAccuracy:true,timeout:MAXMS,maximumAge:0});
  setTimeout(()=>{ if(gpsWatch!=null) finish(); }, MAXMS+800);
}
function undoGps(){ if(aoiPts.length){ aoiPts.pop(); gpsAcc.pop(); redrawAoi(); renderGps(aoiPts.length? 'Kona ya mwisho imefutwa.':'Zimefutwa zote.'); } }

// ---- KUFUATILIA (auto-tracking): tembea mpaka, app inarekodi njia yenyewe ----
let tracking=false, trackWatch=null;
const MIN_MOVE=8;   // mita: point mpya inaongezwa ukisonga umbali huu (kuepuka jitter)
const MAX_ACC=30;   // mita: puuza visomo vyenye usahihi mbaya kuliko hapa
function startTracking(){
  if(!navigator.geolocation){ renderGps('GPS haipatikani kwenye kifaa hiki. Tumia app ya Android.'); return; }
  if(tracking) return;
  aoiPts=[]; gpsAcc=[]; aoiLayer.clearLayers(); tracking=true; buildCtx();
  document.getElementById('panel').innerHTML='<h4>🚶 Kufuatilia (tembea mpaka)</h4>'+
    '<div style="font-size:.82rem;color:var(--accent)">▶️ Simama Point A, kisha ANZA kutembea kuzunguka mpaka wa eneo. Kila unaposonga ~'+MIN_MOVE+' m, point inaongezwa yenyewe. Ukirudi Point A, bonyeza «⏹️ Simamisha».</div>';
  trackWatch=navigator.geolocation.watchPosition(
    pos=>{ const c=pos.coords, acc=c.accuracy||9999;
      if(acc>MAX_ACC){ document.getElementById('panel').innerHTML='<h4>🚶 Kufuatilia</h4><div style="font-size:.82rem;color:#B3261E">📡 Inasubiri usahihi mzuri (sasa ±'+Math.round(acc)+' m)… simama eneo wazi.</div>'; return; }
      const last=aoiPts[aoiPts.length-1];
      const moved = last ? hv(last[0],last[1],c.latitude,c.longitude)*1000 : Infinity;
      if(moved>=MIN_MOVE){
        aoiPts.push([c.latitude,c.longitude]); gpsAcc.push(acc); redrawAoi();
        map.setView([c.latitude,c.longitude], Math.max(map.getZoom(),16));
      }
      let s='▶️ Kufuatilia… points '+aoiPts.length+' (±'+Math.round(acc)+' m).';
      if(aoiPts.length>=3){ const r=areaPerim(aoiPts); s+=' Eneo sasa: <b>'+(r.area/10000).toFixed(3)+' ha</b>.'; }
      s+='<br>Bonyeza «⏹️ Simamisha» ukirudi Point A.';
      document.getElementById('panel').innerHTML='<h4>🚶 Kufuatilia (tembea mpaka)</h4><div style="font-size:.82rem;color:var(--accent)">'+s+'</div>';
    },
    err=>{ renderGps('GPS imeshindwa: '+err.message+'. Ruhusu location.'); tracking=false; trackWatch=null; buildCtx(); },
    {enableHighAccuracy:true, timeout:20000, maximumAge:1000});
}
function stopTracking(){
  if(trackWatch!=null){ navigator.geolocation.clearWatch(trackWatch); trackWatch=null; }
  tracking=false; buildCtx();
  if(aoiPts.length<3){ renderGps('Umesimamisha — points '+aoiPts.length+' hazitoshi (zinahitajika 3+). Jaribu tena ukizunguka eneo lote.'); return; }
  renderGps('✓ Umemaliza kuzunguka! Points '+aoiPts.length+' zimerekodiwa. Angalia eneo hapa chini na «💾 Hifadhi».');
}

// API base: ikihudumiwa na backend (http/https) -> origin; vinginevyo weka anwani ya
// server (LAN) kwenye localStorage 'geo_api'. Bila backend -> hifadhi ya ndani (offline).
const API_BASE = (location.protocol.startsWith('http') ? location.origin : (localStorage.getItem('geo_api')||''));
const LS_KEY='geologist_records_v1';
let backendUp=false;
function getLocal(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return [];} }
function setLocal(a){ try{localStorage.setItem(LS_KEY,JSON.stringify(a));return true;}catch(e){return false;} }
async function apiTry(){
  if(!API_BASE){ backendUp=false; return false; }
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),2500);  // isigande kamwe
    const r=await fetch(API_BASE+'/api/health',{cache:'no-store',signal:ctl.signal});
    clearTimeout(to); backendUp=r.ok;
  }catch(e){ backendUp=false; }
  return backendUp;
}
async function saveCurrent(){
  if(aoiPts.length<3){ alert('Weka pembe 3+ kwanza.'); return; }
  const r=areaPerim(aoiPts);
  const clat=aoiPts.reduce((s,p)=>s+p[0],0)/aoiPts.length, clon=aoiPts.reduce((s,p)=>s+p[1],0)/aoiPts.length;
  const g=commoditiesAt(clat,clon);
  const name=prompt('Jina la eneo (mfano: Shamba la Juma):','Eneo '+new Date().toLocaleDateString());
  if(name===null) return;
  const accs=gpsAcc.filter(x=>x);
  const acc = accs.length ? Math.round(accs.reduce((s,x)=>s+x,0)/accs.length) : null;
  const body={ name:name||'Eneo', points:aoiPts.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]),
    method:(mode==='gps'?'gps':'manual'), commodities:g.commod, accuracy_m:acc };
  await apiTry();
  if(backendUp){
    try{
      const res=await fetch(API_BASE+'/api/surveys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok) throw 0;
      const rec=await res.json();
      alert('✓ Imehifadhiwa BACKEND: '+rec.name+' ('+rec.area_ha+' ha). Ripoti ya PDF inatengenezwa.');
      buildAreaPdf(body.name, true);
      renderSidebar(); toggleSidebar(true); return;
    }catch(e){ /* anguka kwa offline */ }
  }
  const rec={ id:'loc_'+Date.now(), ...body, area_ha:+(r.area/10000).toFixed(4),
    acres:+(r.area/4046.8564224).toFixed(3), perim_km:+(r.perim/1000).toFixed(4),
    date:new Date().toISOString(), _pending:true };
  const arr=getLocal(); arr.unshift(rec); setLocal(arr);
  alert('✓ Imehifadhiwa (OFFLINE): '+rec.name+'. Itasync backend ikipatikana. Ripoti ya PDF inatengenezwa.');
  buildAreaPdf(body.name, true);
  renderSidebar(); toggleSidebar(true);
}
async function loadRecords(){

// ---------- SAUTI YA BEEP (Web Audio, bila faili, hufanya kazi offline) ----------
function beep(times, freq){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC(); let t=ctx.currentTime;
    for(let i=0;i<(times||1);i++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=freq||880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.start(t); o.stop(t+0.22); t+=0.3;
    }
  }catch(e){}
}

// ---------- RADA YA MADINI (duara la 1km kutoka ulipo — kama rada) ----------
// Data: prospectivity halisi ya Sentinel-2 (HOTSPOTS) + rejea ya mineral belts za TZ (BELTS).
const RADAR_KM=1;
let radarWatch=null;
function mineralRadar(){
  if(!navigator.geolocation){ document.getElementById('panel').innerHTML='<h4>📡 Rada</h4><div style="color:#B3261E;font-size:.82rem">❌ GPS haipatikani kwenye kifaa hiki. Tumia app ya simu/Android.</div>'; return; }
  if(radarWatch!=null) return;
  let best=null,n=0; const TARGET=15,MAXMS=9000,t0=Date.now();
  document.getElementById('panel').innerHTML='<h4>📡 Rada ya madini (1km)</h4><div style="font-size:.82rem;color:var(--accent)">📡 Inasoma GPS… simama tuli, inasubiri usahihi mzuri.</div>';
  function finish(){
    if(radarWatch!=null){ navigator.geolocation.clearWatch(radarWatch); radarWatch=null; }
    if(!best){ document.getElementById('panel').innerHTML='<h4>📡 Rada</h4><div style="color:#B3261E;font-size:.82rem">❌ GPS haikupata nafasi. Nenda nje/eneo wazi, ruhusu location, jaribu tena.</div>'; return; }
    radarAt(best.lat,best.lon,best.acc);
  }
  radarWatch=navigator.geolocation.watchPosition(
    pos=>{ const c=pos.coords; n++;
      if(!best||(c.accuracy||9999)<best.acc) best={lat:c.latitude,lon:c.longitude,acc:c.accuracy||9999};
      if(best.acc<=TARGET||Date.now()-t0>MAXMS) finish();
    },
    err=>{ if(radarWatch!=null){navigator.geolocation.clearWatch(radarWatch);radarWatch=null;}
      document.getElementById('panel').innerHTML='<h4>📡 Rada</h4><div style="color:#B3261E;font-size:.82rem">❌ '+err.message+'. Ruhusu location (browser inahitaji HTTPS; au tumia app ya Android).</div>'; },
    {enableHighAccuracy:true,timeout:MAXMS,maximumAge:0});
  setTimeout(()=>{ if(radarWatch!=null) finish(); }, MAXMS+800);
}
function radarAt(lat,lon,acc){
  radarLayer.clearLayers(); aoiLayer.clearLayers();
  // duara la rada 1km + kituo (ulipo)
  L.circle([lat,lon],{radius:RADAR_KM*1000,color:'#ffd400',weight:2,fillColor:'#ffd400',fillOpacity:.08}).addTo(radarLayer);
  L.circleMarker([lat,lon],{radius:6,color:'#fff',fillColor:'#B3261E',fillOpacity:1,weight:2}).addTo(radarLayer)
    .bindTooltip('📍 Uliposimama',{permanent:false});
  map.setView([lat,lon], 14);
  // 1) mineral belts halisi zinazokuathiri (uko ndani ya radius ya ukanda)
  const rk=BELTS.map(b=>({b,d:hv(lat,lon,b.lat,b.lon)})).sort((x,y)=>x.d-y.d);
  const within=rk.filter(x=>x.d<=x.b.r);
  const nearest=rk[0];
  // 2) prospectivity hotspots (Sentinel-2 halisi) ndani ya 1km
  let hot=[];
  for(const reg in HOTSPOTS){ HOTSPOTS[reg].forEach(p=>{ const d=hv(lat,lon,p[0],p[1]); if(d<=RADAR_KM) hot.push({lat:p[0],lon:p[1],sc:p[2],d}); }); }
  hot.sort((a,b)=>b.sc-a.sc);
  hot.slice(0,60).forEach(p=>{ L.circleMarker([p.lat,p.lon],{radius:5,color:'#fff',fillColor:color(p.sc),fillOpacity:.9,weight:1}).addTo(radarLayer)
    .bindPopup('Uwezekano (satelaiti): <b>'+(p.sc*100).toFixed(0)+'%</b>'); });
  const src = within.length ? within.map(x=>x.b) : [nearest.b];
  const commod=[...new Set(src.flatMap(b=>b.c))];
  const strong = hot.length>0 || within.length>0;
  const maxSc = hot.length ? hot[0].sc : 0;
  // BEEP: madini yamegunduliwa -> beep 3; hakuna -> beep moja hafifu
  if(strong) beep(3,940); else beep(1,480);
  // AUTO-RIPOTI (inaonekana moja kwa moja)
  let h='<h4>📡 Rada ya madini — 1km</h4>';
  h+='<div style="font-size:.74rem;color:#555">📍 '+lat.toFixed(6)+', '+lon.toFixed(6)+' (±'+Math.round(acc)+' m)</div>';
  if(strong){
    h+='<div style="margin-top:6px;background:#eafbea;border:1px solid #3d6b39;border-radius:8px;padding:7px">'+
       '<div style="color:#3d6b39;font-weight:800">🔔 KUNA VIASHIRIA VYA MADINI</div>'+
       '<div style="font-size:.84rem;margin-top:2px"><b>Madini yanayowezekana:</b> '+(commod.join(', ')||'-')+'</div>';
    if(within.length) h+='<div style="font-size:.78rem;margin-top:2px">Uko NDANI ya ukanda: <b>'+within[0].b.name+'</b></div>';
    if(hot.length) h+='<div style="font-size:.78rem">Alama za satelaiti ndani ya 1km: <b>'+hot.length+'</b> (juu zaidi '+(maxSc*100).toFixed(0)+'%)</div>';
    h+='</div>';
  } else {
    h+='<div style="margin-top:6px;background:#fff4f0;border:1px solid #E4761B;border-radius:8px;padding:7px">'+
       '<div style="color:#B3261E;font-weight:800">○ Hakuna kiashiria kikubwa ndani ya 1km</div>'+
       '<div style="font-size:.8rem;margin-top:2px">Ukanda wa karibu: <b>'+nearest.b.name+'</b> (~'+nearest.d.toFixed(0)+' km)</div>'+
       '<div style="font-size:.8rem">Madini ya kikanda: '+nearest.b.c.join(', ')+'</div></div>';
  }
  h+='<div class="pill" style="background:#7a5c00;margin-top:8px;padding:5px 10px;cursor:pointer;display:inline-block" onclick="buildRadarPdf()">📄 Ripoti ya rada (PDF)</div>';
  h+='<div style="font-size:.7rem;color:#B3261E;margin-top:6px">⚠️ Viashiria vya kikanda + prospectivity ya satelaiti (Sentinel-2) — SI uthibitisho. Thibitisha kwa sampuli + maabara.</div>';
  document.getElementById('panel').innerHTML=h;
  lastRadar={lat,lon,acc,report:{lat,lon,acc,commod,strong,maxSc,hot:hot.length,faultPct:null,
    within:within.map(x=>({name:x.b.name,d:x.d})), nearest:{name:nearest.b.name,d:nearest.d,c:nearest.b.c}}};
  // Uchambuzi wa NYUFA (faults) kutoka DEM — dhahabu hupatikana kando ya faults
  const pf=document.createElement('div'); pf.id='radarFault';
  pf.style.cssText='font-size:.78rem;color:#555;margin-top:5px;border-top:1px dashed #ddd;padding-top:4px';
  pf.innerHTML='🧭 Inachambua nyufa (faults) kutoka DEM…';
  document.getElementById('panel').appendChild(pf);
  faultScan(lat,lon,res=>{
    const e=document.getElementById('radarFault'); if(!e) return;
    if(res.err){ e.innerHTML='🧭 Nyufa (faults): inahitaji internet kupakua DEM.'; return; }
    lastFaults={lat,lon,...res}; if(map.hasLayer(faultLayer)) updateFaultsView();
    const pct=(res.density*100).toFixed(1); if(lastRadar&&lastRadar.report) lastRadar.report.faultPct=pct;
    e.innerHTML='🧭 <b>Nyufa (faults): '+pct+'%</b> — '+(res.density>0.06?'dhahabu ya orogenic hupatikana <b>kando ya faults</b> (eneo la kuvutia).':'msongamano mdogo wa nyufa.');
  });
}

  doc.save('rada_madini_'+Date.now()+'.pdf');

// ---------- PIGA PICHA YA MWAMBA: kiashiria cha rangi (uchambuzi halisi wa canvas) ----------
function classifyRock(r,g,b,darkF,metalF,brightF){
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx-mn;
  if(metalF>0.15 && r>150 && g>120 && b<150 && r>=g)
    return {label:"Sulfidi ing'aayo (pyrite/chalcopyrite) — au dhahabu",
      note:'Mwonekano wa metali ya njano. Pyrite ni "dhahabu ya wapumbavu"; chalcopyrite hubeba shaba. Dhahabu halisi ni laini, hailegei/haing\'ai kama pyrite.',
      commod:['gold','copper','pyrite/sulphides']};
  if(metalF>0.15 && sat<30)
    return {label:'Metali/kijivu ing\'aayo (galena, magnetite, arsenopyrite)',
      note:'Ung\'aavu wa metali usio na rangi kali: galena (risasi), magnetite (chuma, huvuta sumaku), arsenopyrite.',
      commod:['lead','iron','sulphides']};
  if(r>120 && r>g+25 && g>b)
    return {label:'Oksidi za chuma / gossan (kutu-machungwa)',
      note:'Rangi ya kutu = iron oxide (limonite/hematite). Gossan (kofia ya kutu juu ya sulfidi) ni KIASHIRIA muhimu cha dhahabu/shaba chini.',
      commod:['iron','gold (pathfinder)','copper']};
  if(g>r && g>b && g>90)
    return {label:'Kijani — shaba (malachite) au madini ya chlorite',
      note:'Kijani angavu = shaba (malachite/chrysocolla). Kijani hafifu = chlorite/serpentine (kawaida katika greenstone yenye dhahabu).',
      commod:['copper','nickel','gold (greenstone)']};
  if(b>r && b>g && b>90)
    return {label:'Bluu/zambarau — vito (tanzanite/sapphire) uwezekano',
      note:'Kwenye kanda za vito (Merelani, Umba, Winza) huweza kuwa tanzanite/sapphire. Nje ya kanda hizo mara nyingi ni azurite/mengine.',
      commod:['tanzanite','sapphire']};
  if(r>140 && r>g+30 && r>b+30)
    return {label:'Nyekundu — garnet/ruby uwezekano (kanda za vito)',
      note:'Nyekundu ya fuwele huweza kuwa garnet au ruby (Winza, Mahenge, Umba). Thibitisha ugumu na uwazi.',
      commod:['ruby','garnet']};
  if(brightF>0.25 && sat<40)
    return {label:'Nyeupe/angavu — quartz/calcite/feldspar',
      note:'Mishipa ya quartz nyeupe mara nyingi hubeba dhahabu (orogenic gold veins). Angalia madoa ya metali ndani ya quartz.',
      commod:['gold (quartz veins)']};
  if(darkF>0.3)
    return {label:'Mwamba mweusi/giza — magnetite/graphite/basalt',
      note:'Miamba myeusi: magnetite (chuma, huvuta sumaku), graphite (laini, huacha alama), au basalt. Jaribu sumaku na ulaini.',
      commod:['iron','graphite']};
  return {label:'Haijulikani wazi kwa rangi',
    note:'Rangi haitoi kiashiria dhahiri. Piga picha karibu, mwanga mzuri, sehemu safi ya mwamba (si udongo/nyasi).',
    commod:[]};
}
function analyzeRock(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const img=new Image();
  img.onload=function(){
    const S=72, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
    const cx=cv.getContext('2d'); cx.drawImage(img,0,0,S,S);
    let d; try{ d=cx.getImageData(0,0,S,S).data; }catch(e){ alert('Imeshindikana kusoma picha.'); return; }
    let r=0,g=0,b=0,n=0,dark=0,metal=0,bright=0;
    for(let i=0;i<d.length;i+=4){ const R=d[i],G=d[i+1],B=d[i+2]; r+=R;g+=G;b+=B;n++;
      const mx=Math.max(R,G,B),mn=Math.min(R,G,B);
      if(mx<75) dark++; if(mx>150&&mx-mn<28) metal++; if(mx>200) bright++;
    }
    r/=n;g/=n;b/=n;
    const res=classifyRock(r,g,b,dark/n,metal/n,bright/n);
    input.value='';
    let h='<h4>📷 Picha ya mwamba — kiashiria</h4>'+
      '<div style="display:flex;gap:8px;align-items:center;margin:4px 0">'+
        '<div style="width:34px;height:34px;border-radius:6px;border:1px solid #ccc;background:rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')"></div>'+
        '<div style="font-size:.74rem;color:#555">Rangi kuu: RGB('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')</div></div>'+
      '<div style="font-size:.86rem"><b>Uwezekano:</b> '+res.label+'</div>'+
      '<div style="font-size:.8rem;color:#333;margin-top:3px">'+res.note+'</div>'+
      (res.commod.length?'<div style="font-size:.8rem;margin-top:4px"><b>Madini ya kuchunguza:</b> '+res.commod.join(', ')+'</div>':'');
    if(lastRadar) h+='<div style="font-size:.74rem;color:#555;margin-top:3px">Kwenye eneo lako la mwisho, madini ya kikanda: '+commoditiesAt(lastRadar.lat,lastRadar.lon).commod.join(', ')+'</div>';
    h+='<div style="font-size:.72rem;color:#B3261E;margin-top:6px">⚠️ Hiki ni kiashiria cha RANGI tu — SI utambuzi wa madini. Utambuzi halisi: mtaalamu + vipimo (streak, ugumu, XRF/maabara).</div>';
    document.getElementById('panel').innerHTML=h;
    if(res.commod.length) beep(2,760);
  };
  img.onerror=function(){ alert('Imeshindwa kufungua picha.'); };
  img.src=URL.createObjectURL(f);
}

// ---------- NYUFA / MIUNDO (LINEAMENTS) kutoka DEM halisi ----------
// Dhahabu (orogenic) nyingi hupatikana KANDO ya faults. Tunakokotoa lineaments kwa
// Sobel edge detection kwenye ELEVATION HALISI (DEM tiles za terrarium — chanzo kile
// kile cha ramani ya 3D). Mbinu ya kawaida ya remote sensing. INAHITAJI internet.
function lonlat2tile(lat,lon,z){ const n=Math.pow(2,z);
  const x=Math.floor((lon+180)/360*n);
  const y=Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n);
  return {x,y}; }
function tile2lon(x,z){ return x/Math.pow(2,z)*360-180; }
function tile2lat(y,z){ const nn=Math.PI-2*Math.PI*y/Math.pow(2,z); return 180/Math.PI*Math.atan(0.5*(Math.exp(nn)-Math.exp(-nn))); }
const F_Z=13, F_MINZOOM=12, F_MAXTILES=20; const faultCache={};
let faultAutoHeat=null, faultsBusy=false;
function setFaultHint(t){ const e=document.getElementById('faulthint'); if(e){ e.style.display=t?'block':'none'; e.innerHTML=t||''; } }
// Chambua tile MOJA ya DEM -> points za lineaments (na cache ili isirudie)
function faultScanTile(x,y,cb){
  const key=F_Z+'/'+x+'/'+y, c=faultCache[key];
  if(c==='err'){ cb(null,true); return; } if(Array.isArray(c)){ cb(c); return; } if(c==='pending'){ cb(null); return; }
  faultCache[key]='pending';
  const urls=['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/'+F_Z+'/'+x+'/'+y+'.png',
              'https://elevation-tiles-prod.s3.amazonaws.com/terrarium/'+F_Z+'/'+x+'/'+y+'.png'];
  let ui=0; const img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){
    const S=256, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
    const cx=cv.getContext('2d'); cx.drawImage(img,0,0,S,S);
    let d; try{ d=cx.getImageData(0,0,S,S).data; }catch(e){ faultCache[key]='err'; cb(null,true); return; }
    const el=new Float32Array(S*S);
    for(let i=0;i<S*S;i++){ el[i]=(d[i*4]*256+d[i*4+1]+d[i*4+2]/256)-32768; }  // decode terrarium
    const mag=new Float32Array(S*S); let mx=0; const at=(a,b)=>el[b*S+a];
    for(let yy=1;yy<S-1;yy++)for(let xx=1;xx<S-1;xx++){
      const gx=(at(xx+1,yy-1)+2*at(xx+1,yy)+at(xx+1,yy+1))-(at(xx-1,yy-1)+2*at(xx-1,yy)+at(xx-1,yy+1));
      const gy=(at(xx-1,yy+1)+2*at(xx,yy+1)+at(xx+1,yy+1))-(at(xx-1,yy-1)+2*at(xx,yy-1)+at(xx+1,yy-1));
      const m=Math.sqrt(gx*gx+gy*gy); mag[yy*S+xx]=m; if(m>mx)mx=m;
    }
    // thr yenye SAKAFU kamili (8 m): kuepuka false-positives kwenye maeneo tambarare (maziwa/bahari)
    const thr=Math.max(mx*0.4, 8), lon0=tile2lon(x,F_Z),lon1=tile2lon(x+1,F_Z),lat0=tile2lat(y,F_Z),lat1=tile2lat(y+1,F_Z);
    const pts=[];
    for(let yy=1;yy<S-1;yy+=3)for(let xx=1;xx<S-1;xx+=3){ if(mag[yy*S+xx]>=thr)
      pts.push([lat0+(lat1-lat0)*(yy/S), lon0+(lon1-lon0)*(xx/S), Math.min(1,mag[yy*S+xx]/mx)]); }
    faultCache[key]=pts; cb(pts);
  };
  img.onerror=function(){ if(ui<urls.length-1){ ui++; img.src=urls[ui]; } else { faultCache[key]='err'; cb(null,true); } };
  img.src=urls[0];
}
// Tabaka la nyufa AUTO kwa eneo LINALOONEKANA (hujiimarisha ukikaribia/zoom)
function updateFaultsView(){
  if(!map.hasLayer(faultLayer)) return;
  if(map.getZoom()<F_MINZOOM){ faultLayer.clearLayers(); faultAutoHeat=null; setFaultHint('🧭 Nyufa (faults): karibia zaidi (zoom) ili kuona.'); return; }
  const b=map.getBounds();
  const tA=lonlat2tile(b.getNorth(),b.getWest(),F_Z), tB=lonlat2tile(b.getSouth(),b.getEast(),F_Z);
  const x0=Math.min(tA.x,tB.x),x1=Math.max(tA.x,tB.x),y0=Math.min(tA.y,tB.y),y1=Math.max(tA.y,tB.y);
  const tiles=[]; for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++) tiles.push([x,y]);
  if(tiles.length>F_MAXTILES){ setFaultHint('🧭 Karibia zaidi ili kuchambua nyufa.'); return; }
  if(faultsBusy) return; faultsBusy=true; setFaultHint('🧭 Inachambua nyufa (DEM)…');
  let all=[], done=0, anyErr=false;
  tiles.forEach(([x,y])=>faultScanTile(x,y,(pts,err)=>{
    if(pts) all=all.concat(pts); if(err) anyErr=true;
    if(++done===tiles.length){
      faultsBusy=false; faultLayer.clearLayers();
      if(all.length){ faultAutoHeat=L.heatLayer(all,{radius:8,blur:7,minOpacity:.35,gradient:{0.3:'#ff9d5c',0.6:'#B3261E',0.9:'#7a0000'}}); faultLayer.addLayer(faultAutoHeat); }
      setFaultHint(all.length? '🧭 Nyufa/faults (nyekundu). Dhahabu hupatikana kando ya faults.' : (anyErr?'🧭 Nyufa: inahitaji internet (DEM).':'🧭 Hakuna nyufa dhahiri hapa.'));
    }
  }));
}
// Uchambuzi wa nyufa kwa NUKTA moja (density kwa rada/ripoti)
function faultScan(lat,lon,cb){ const t=lonlat2tile(lat,lon,F_Z);
  faultScanTile(t.x,t.y,(pts,err)=>{ if(err||!pts){ cb({err:err?'net':'none'}); return; }
    const samples=Math.pow(Math.floor((256-2)/3),2);
    cb({density: pts.length/samples, pts, z:F_Z}); }); }
// Kitufe cha Nyufa: washa tabaka + ripoti ya nukta uliposimama
function runFaults(){
  if(!map.hasLayer(faultLayer)) faultLayer.addTo(map);
  let lat,lon; if(lastRadar){ lat=lastRadar.lat; lon=lastRadar.lon; } else { const c=map.getCenter(); lat=c.lat; lon=c.lng; }
  map.setView([lat,lon], Math.max(map.getZoom(),13));
  document.getElementById('panel').innerHTML='<h4>🧭 Nyufa / Miundo (faults)</h4><div style="font-size:.82rem;color:var(--accent)">⛰️ Inapakua mwinuko (DEM) na kuchambua nyufa… (internet)</div>';
  updateFaultsView();
  faultScan(lat,lon,res=>{
    if(res.err){ document.getElementById('panel').innerHTML='<h4>🧭 Nyufa</h4><div style="font-size:.82rem;color:#B3261E">❌ '+(res.err==='net'?'Imeshindwa kupata DEM — hakikisha una internet.':'Data ya DEM imezuiwa kwenye kifaa hiki (CORS).')+'</div><div style="font-size:.75rem;color:#555;margin-top:4px">Nyufa zinahitaji internet kupakua mwinuko (DEM).</div>'; return; }
    lastFaults={lat,lon,...res};
    const pct=(res.density*100).toFixed(1), lvl=res.density>0.12?'JUU':res.density>0.06?'wastani':'chini';
    document.getElementById('panel').innerHTML='<h4>🧭 Nyufa / Miundo (faults)</h4>'+
      '<div style="font-size:.74rem;color:#555">📍 '+lat.toFixed(5)+', '+lon.toFixed(5)+' · DEM z'+res.z+'</div>'+
      '<div style="margin-top:6px;background:#fff4f0;border:1px solid #B3261E;border-radius:8px;padding:7px">'+
        '<div style="font-weight:800;color:#B3261E">Msongamano wa nyufa: '+pct+'% ('+lvl+')</div>'+
        '<div style="font-size:.8rem;margin-top:2px">Nyekundu kwenye ramani = kingo kali za mwinuko (huweza kuwa faults).</div>'+
        '<div style="font-size:.8rem;margin-top:2px">🔎 Dhahabu ya orogenic hupatikana <b>kando ya faults</b> — nyufa nyingi = kuvutia.</div>'+
      '</div>'+
      '<div style="font-size:.7rem;color:#B3261E;margin-top:6px">⚠️ Lineaments za DEM — viashiria, SI ramani rasmi ya faults.</div>';
    if(res.density>0.06) beep(2,660);
  });
}

          + '<button class="act" onclick="runFaults()">🧭 Nyufa (faults)</button>'
          + '<button class="act" onclick="document.getElementById(\'rockcam\').click()">📷 Piga picha mwamba</button>'
          + '<button onclick="startTracking()">▶️ Tembea mpaka</button>'
          + '<button onclick="captureGps()">📍 Rekodi kona</button>'
          + '<button class="'+(clickToAdd?'on':'')+'" onclick="toggleClick()">✏️ Weka pembe: '+(clickToAdd?'ON':'OFF')+'</button>'
          + '<button onclick="openCoords()">⌨️ Coords</button>'
          + '<button onclick="undoGps()">↩ Futa ya mwisho</button>'
          + '<button class="danger" onclick="clearAoi()">Anza upya</button>');
    document.getElementById('legend').style.display='none';
  }
}
function toggleClick(){ clickToAdd=!clickToAdd; buildCtx(); }
function setMode(m){
  if(trackWatch!=null){ navigator.geolocation.clearWatch(trackWatch); trackWatch=null; } tracking=false;
  mode=m;
  document.getElementById('mView').classList.toggle('on',m==='view');
  document.getElementById('mGps').classList.toggle('on',m==='gps');
  if(m==='view'){ aoiLayer.clearLayers(); radarLayer.clearLayers(); clickToAdd=false; buildCtx(); renderView(); }
  else { dataLayer.clearLayers(); if(heat){heat.remove();heat=null;} aoiPts=[]; gpsAcc=[]; clickToAdd=false;
    aoiLayer.clearLayers(); radarLayer.clearLayers(); buildCtx(); renderGps();
  }
}

// ---------- RAMANI YA 3D (MapLibre + terrain, bure) ----------
function open3D(){
  const c=map.getCenter(); const z=Math.max(map.getZoom(),7);
  location.href='map3d.html?lat='+c.lat.toFixed(5)+'&lon='+c.lng.toFixed(5)+'&z='+z;
}

// ---------- KITUFE CHA VOLUME (+): huweka point ya GPS shambani (kupitia app ya Android) ----------
// MainActivity ya Android hukamata kitufe cha sauti (+), kisha huita hii.
window.__volCapture=function(){
  if(mode!=='gps'){ setMode('gps'); }
  if(tracking) return;          // auto-tracking tayari inarekodi yenyewe
  captureGps();                 // weka kona kwa nafasi ya sasa ya GPS
};

// ---------- SPLASH (by Khamis Suleiman) ----------
setTimeout(function(){ var s=document.getElementById('splash'); if(s){ s.classList.add('hide'); setTimeout(function(){ if(s&&s.parentNode) s.parentNode.removeChild(s); }, 700); } }, 1900);

// anza
buildCtx(); renderView();
setTimeout(function(){ if(map.hasLayer(faultLayer)) updateFaultsView(); }, 1200);  // nyufa zionekane zikifunguka
</script>
