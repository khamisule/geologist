<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geologist — Mfumo wa Madini Tanzania</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  :root{--accent:#3d6b39;--dark:#2d4a2b;--hi:#B3261E;--md:#E4761B;--gold:#ffd400;--muted:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:system-ui,Roboto,Segoe UI,sans-serif;background:#000;color:var(--dark)}
  #map{position:absolute;inset:0;z-index:1}
  /* Upau wa juu */
  #bar{position:absolute;top:0;left:0;right:0;z-index:1000;background:linear-gradient(180deg,rgba(45,74,43,.97),rgba(45,74,43,.82));color:#fff;padding:8px 12px}
  #bar .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #bar .logo{font-weight:800;font-size:1.05rem}
  #bar .logo span{color:var(--gold)}
  .modebtns{display:flex;gap:6px;margin-left:auto}
  .modebtns button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:18px;font-size:.85rem;cursor:pointer;font-weight:600}
  .modebtns button.on{background:#fff;color:var(--accent)}
  #ctx{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #ctx button,.chip{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);padding:5px 11px;border-radius:15px;font-size:.8rem;cursor:pointer}
  #ctx button.on{background:#fff;color:var(--accent);font-weight:700}
  #ctx .act{background:var(--gold);color:#000;font-weight:700;border:none}
  #ctx .danger{background:var(--hi);border:none}
  /* Paneli ya chini */
  #panel{position:absolute;left:10px;bottom:12px;z-index:1000;background:rgba(255,255,255,.96);border-radius:12px;padding:12px 14px;font-size:.82rem;max-width:270px;box-shadow:0 3px 12px rgba(0,0,0,.4);max-height:56vh;overflow:auto}
  #panel h4{color:var(--accent);font-size:.95rem;margin-bottom:4px}
  #panel .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;cursor:pointer}
  #panel .row:hover{color:var(--hi)}
  .pill{display:inline-block;color:#fff;border-radius:5px;padding:0 6px;font-weight:700;font-size:.74rem}
  .big{font-size:1.5rem;font-weight:800;color:var(--accent)}
  .legend{position:absolute;right:10px;bottom:12px;z-index:1000;background:rgba(255,255,255,.95);border-radius:9px;padding:8px 10px;font-size:.72rem;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  /* Dirisha la kuandika coords */
  #coordbox{position:absolute;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
  #coordbox .inner{background:#fff;border-radius:14px;padding:16px;width:min(92%,440px)}
  #coordbox h3{color:var(--accent);margin-bottom:8px}
  #coordbox textarea{width:100%;height:150px;font-family:ui-monospace,Consolas,monospace;font-size:13px;border:1px solid #bbb;border-radius:8px;padding:8px}
  #coordbox .b{display:flex;gap:8px;margin-top:10px}
  #coordbox button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
  #coordbox .ok{background:var(--accent);color:#fff}#coordbox .cancel{background:#eee}
  .note{position:absolute;left:290px;right:150px;bottom:2px;z-index:900;text-align:center;color:#fff;font-size:.64rem;opacity:.5;pointer-events:none}
  .leaflet-control-zoom a{width:40px;height:40px;line-height:40px;font-size:22px;font-weight:700;color:var(--accent)}
  .leaflet-control-zoom{margin-bottom:80px !important}
  .ptlabel{background:var(--hi);color:#fff;border:none;font-weight:700;font-size:11px;padding:1px 5px;border-radius:8px}
  @media(max-width:560px){.note{display:none}#panel{max-width:200px;font-size:.78rem}}
  /* Sidebar ya historia (kutoka backend) */
  #sidebar{position:absolute;top:0;left:0;bottom:0;width:300px;max-width:85vw;z-index:1500;background:#fff;
    box-shadow:2px 0 14px rgba(0,0,0,.4);transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column}
  #sidebar.open{transform:none}
  #sidebar .sbhead{background:var(--dark);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}
  #sidebar .sbhead h3{font-size:1rem;flex:1;margin:0}
  #sidebar .sbclose{cursor:pointer;font-size:1.2rem;line-height:1}
  #sbstatus{font-size:.7rem;padding:5px 12px;border-bottom:1px solid #eee}
  #sblist{flex:1;overflow:auto;padding:6px 12px}
  .sbitem{border-bottom:1px solid #eee;padding:8px 0}
  .sbitem .nm{font-weight:700}
  .sbitem .mt{font-size:.7rem;color:var(--muted)}
  .sbitem .pill{margin:4px 4px 0 0;padding:2px 8px;cursor:pointer;display:inline-block}
</style>
</head>
<body>
<div id="map"></div>

<div id="bar">
  <div class="top">
    <div class="logo">⛏️ GEO<span>LOGIST</span></div>
    <div class="modebtns">
      <button id="mView" class="on" onclick="setMode('view')">🗺️ Ona Madini</button>
      <button id="mMeas" onclick="setMode('measure')">📐 Pima</button>
      <button id="mGps" onclick="setMode('gps')">🚶 GPS</button>
      <button id="mRec" onclick="toggleSidebar()">📋 Historia</button>
    </div>
  </div>
  <div id="ctx"></div>
</div>

<div id="sidebar">
  <div class="sbhead"><h3>📋 Historia ya Maeneo</h3><span class="sbclose" onclick="toggleSidebar(false)">✕</span></div>
  <div id="sbstatus"></div>
  <div id="sblist"></div>
</div>
<div id="panel"></div>
<div class="legend" id="legend"></div>
<div class="note">Viashiria vya satelaiti — thibitisha shambani (sampuli + lab).</div>

<div id="coordbox">
  <div class="inner">
    <h3>Andika point za eneo</h3>
    <div style="font-size:.8rem;color:#555;margin-bottom:6px">DMS (05° 11' 56" S) au decimal (-5.19, 36.47). Lat kisha lon, kila point.</div>
    <textarea id="coordinp" spellcheck="false"></textarea>
    <div class="b">
      <button class="ok" onclick="applyCoords()">Tumia</button>
      <button class="cancel" onclick="document.getElementById('coordbox').style.display='none'">Ghairi</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

function color(s){return s>=0.9?'#B3261E':s>=0.85?'#E4761B':'#3d6b39';}
function hv(a1,o1,a2,o2){const R=6371,r=d=>d*Math.PI/180;const dA=r(a2-a1),dO=r(o2-o1);
  const x=Math.sin(dA/2)**2+Math.cos(r(a1))*Math.cos(r(a2))*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function commoditiesAt(lat,lon){
  const rk=BELTS.map(b=>({b,d:hv(lat,lon,b.lat,b.lon)})).sort((x,y)=>x.d-y.d);
  const within=rk.filter(x=>x.d<=x.b.r).map(x=>x.b);
  return {commod:[...new Set((within.length?within:[rk[0].b]).flatMap(b=>b.c))],
          within,nearest:rk.slice(0,3).map(x=>({...x.b,dist:x.d}))};
}

      const fill = region==='dhahabu' ? '#ffd400' : '#B3261E';
      const ring = region==='dhahabu' ? '#7a5c00' : '#ffd400';
      L.circleMarker([b.lat,b.lon],{radius:9,color:ring,fillColor:fill,fillOpacity:1,weight:2}).addTo(dataLayer)
       .bindPopup('<b>'+(region==='dhahabu'?'⭐ ':'')+b.name+'</b><br>Mkoa: '+b.region+
         '<br>Madini: <b>'+b.c.join(', ')+'</b><br><span style="color:#666">'+b.d.join('; ')+'</span>');
    });
    map.setView(CENTERS[region],ZOOMS[region]);
    const title = region==='dhahabu'?'⭐ Maeneo ya Dhahabu':'Madini ya Tanzania';
    document.getElementById('panel').innerHTML='<h4>'+title+'</h4>'+
      '<div style="color:#555;font-size:.75rem;margin-bottom:4px">Maeneo '+belts.length+' yanayojulikana. Bonyeza alama.</div>'+
      belts.slice(0,7).map(b=>'<div class="row" onclick="flyTo('+b.lat+','+b.lon+')"><span>'+b.region+'</span>'+
        '<span class="pill" style="background:'+(region==='dhahabu'?'#ffd400;color:#000':'#B3261E')+'">'+b.name.split(' ')[0]+'</span></div>').join('');
  } else {
    const pts=HOTSPOTS[region], hp=[];
    pts.forEach(p=>{ const[lat,lon,sc,rk]=p; hp.push([lat,lon,Math.max(0,(sc-0.7)/0.3)]);
      const c=commoditiesAt(lat,lon).commod;
      L.circleMarker([lat,lon],{radius:6,color:'#fff',fillColor:color(sc),fillOpacity:.92,weight:1}).addTo(dataLayer)
       .bindPopup('<b>Eneo #'+rk+'</b><br>Uwezekano: <b style="color:'+color(sc)+'">'+(sc*100).toFixed(0)+'%</b>'+
         '<br>Madini (kikanda): <b>'+c.join(', ')+'</b>'); });
    heat=L.heatLayer(hp,{radius:22,blur:18,gradient:{0.3:'#3d6b39',0.6:'#E4761B',0.85:'#B3261E'}}).addTo(map);
    map.setView(CENTERS[region],ZOOMS[region]);
    document.getElementById('panel').innerHTML='<h4>Maeneo bora — '+LABELS[region]+'</h4>'+
      pts.slice(0,5).map(p=>'<div class="row" onclick="flyTo('+p[0]+','+p[1]+')"><span>Eneo #'+p[3]+'</span>'+
        '<span class="pill" style="background:'+color(p[2])+'">'+(p[2]*100).toFixed(0)+'%</span></div>').join('');
  }
}
function flyTo(lat,lon){ map.flyTo([lat,lon],15,{duration:.8}); }

// ---------- MODE: PIMA & CHUNGUZA ----------
const DMS=/(\d+(?:\.\d+)?)\s*[°:\s]\s*(\d+(?:\.\d+)?)\s*['′:\s]\s*(\d+(?:\.\d+)?)\s*["″]?\s*([NSEWnsew])/g;
const DECH=/(-?\d+\.\d+)\s*([NSEWnsew])/g, DEC=/(-?\d+\.\d+)/g;
function parseScalars(t){const pos=[],dm=[];let m;DMS.lastIndex=0;
  while((m=DMS.exec(t))){let v=+m[1]+ +m[2]/60 + +m[3]/3600;const h=m[4].toUpperCase();if(h==='S'||h==='W')v=-v;pos.push([m.index,v]);dm.push([m.index,m.index+m[0].length]);}
  const inD=i=>dm.some(r=>i>=r[0]&&i<r[1]);DECH.lastIndex=0;
  while((m=DECH.exec(t))){if(inD(m.index))continue;let v=+m[1];const h=m[2].toUpperCase();if(h==='S'||h==='W')v=-Math.abs(v);pos.push([m.index,v]);}
  if(pos.length===0){DEC.lastIndex=0;while((m=DEC.exec(t)))pos.push([m.index,+m[1]]);}
  return pos.sort((a,b)=>a[0]-b[0]).map(p=>p[1]);}
function areaPerim(pts){const a=6378137,f=1/298.257223563,e2=2*f-f*f,r=d=>d*Math.PI/180,n=pts.length;
  const la0=pts.reduce((s,p)=>s+p[0],0)/n,lo0=pts.reduce((s,p)=>s+p[1],0)/n;
  const s=Math.sin(r(la0)),w=1-e2*s*s,M=a*(1-e2)/Math.pow(w,1.5),N=a/Math.sqrt(w);
  const xy=pts.map(([la,lo])=>[N*Math.cos(r(la0))*r(lo-lo0),M*r(la-la0)]);let ar=0,pe=0;
  for(let i=0;i<n;i++){const[x1,y1]=xy[i],[x2,y2]=xy[(i+1)%n];ar+=x1*y2-x2*y1;pe+=Math.hypot(x2-x1,y2-y1);}
  return {area:Math.abs(ar/2),perim:pe};}
function redrawAoi(){aoiLayer.clearLayers();
  aoiPts.forEach((p,i)=>{L.marker(p).addTo(aoiLayer).bindTooltip('P'+(i+1),{permanent:true,direction:'top',className:'ptlabel'});
    L.circleMarker(p,{radius:4,color:'#fff',fillColor:'#B3261E',fillOpacity:1,weight:1}).addTo(aoiLayer);});
  if(aoiPts.length>=2) L.polyline(aoiPts,{color:'#ffd400',weight:2}).addTo(aoiLayer);
  if(aoiPts.length>=3) L.polygon(aoiPts,{color:'#ffd400',weight:2,fillColor:'#ffd400',fillOpacity:.15}).addTo(aoiLayer);}
function analyze(){
  if(aoiPts.length<3){ document.getElementById('panel').innerHTML='<h4>📐 Pima & Chunguza</h4><div style="color:#B3261E">Weka pembe 3+ (bonyeza ramani au andika coords).</div>'; return; }
  const r=areaPerim(aoiPts);
  const clat=aoiPts.reduce((s,p)=>s+p[0],0)/aoiPts.length, clon=aoiPts.reduce((s,p)=>s+p[1],0)/aoiPts.length;
  const g=commoditiesAt(clat,clon);
  const verdict = g.within.length ? 'Ndani ya ukanda wa '+g.within[0].name : 'Karibu na '+g.nearest[0].name+' (~'+g.nearest[0].dist.toFixed(0)+' km)';
  document.getElementById('panel').innerHTML='<h4>📐 Matokeo</h4>'+
    '<div class="big">'+(r.area/10000).toFixed(3)+' ha</div>'+
    '<div style="font-size:.8rem">'+r.area.toLocaleString(undefined,{maximumFractionDigits:0})+' m² · '+(r.area/4046.8564224).toFixed(2)+' acres</div>'+
    '<div style="font-size:.8rem;margin-top:2px">Mzunguko: '+(r.perim/1000).toFixed(3)+' km</div>'+
    '<div style="margin-top:6px;border-top:1px solid #eee;padding-top:5px"><b>⛏️ Madini:</b> '+g.commod.join(', ')+'</div>'+
    '<div style="font-size:.78rem;color:#555;margin-top:2px">'+verdict+'</div>'+
    '<div class="pill" style="background:#1560d8;margin-top:8px;padding:5px 10px;cursor:pointer;display:inline-block" onclick="saveCurrent()">💾 Hifadhi eneo</div>'+
    '<div style="font-size:.72rem;color:#B3261E;margin-top:5px">⚠️ Viashiria vya kikanda — thibitisha shambani.</div>';
}
function clearAoi(){ aoiPts=[]; gpsAcc=[]; aoiLayer.clearLayers();
  if(mode==='measure'){ buildCtx(); document.getElementById('panel').innerHTML='<h4>📐 Pima &amp; Chunguza</h4><div style="font-size:.8rem;color:#555">Bonyeza «✏️ Weka pembe» kisha gusa ramani kwenye kila kona ya eneo, au «Andika coords».</div>'; }
  else if(mode==='gps'){ buildCtx(); renderGps('Simama kwenye kona ya kwanza, bonyeza «📍 Rekodi kona hapa».'); } }

// ---------- MODE: GPS SURVEY (tembea mpaka) ----------
function renderGps(msg){
  let h='<h4>🚶 Survey ya GPS</h4>';
  if(msg) h+='<div style="font-size:.8rem;color:var(--accent);margin-bottom:4px">'+msg+'</div>';
  if(aoiPts.length>=3){ const r=areaPerim(aoiPts);
    h+='<div class="big">'+(r.area/10000).toFixed(3)+' ha</div>'+
       '<div style="font-size:.78rem">'+(r.area/4046.8564224).toFixed(2)+' acres · mzunguko '+(r.perim/1000).toFixed(3)+' km</div>';
  } else h+='<div style="font-size:.8rem;color:#555">Kona zilizorekodiwa: '+aoiPts.length+' (zinahitajika 3+).</div>';
  if(aoiPts.length){ h+='<div style="max-height:110px;overflow:auto;margin-top:6px;font-size:.72rem;font-family:ui-monospace,monospace">'+
    aoiPts.map((p,i)=>'Kona '+(i+1)+': '+p[0].toFixed(5)+', '+p[1].toFixed(5)+(gpsAcc[i]?' ±'+Math.round(gpsAcc[i])+'m':'')).join('<br>')+'</div>'; }
  if(aoiPts.length>=3) h+='<div class="pill" style="background:var(--accent);margin-top:7px;padding:5px 10px;cursor:pointer;display:inline-block" onclick="analyze()">⛏️ Chunguza madini</div>'+
    ' <div class="pill" style="background:#1560d8;margin-top:7px;padding:5px 10px;cursor:pointer;display:inline-block" onclick="saveCurrent()">💾 Hifadhi</div>';
  h+='<div style="font-size:.7rem;color:#B3261E;margin-top:6px">⚠️ GPS ya simu ±3–10 m. Kwa mipaka RASMI ya leseni tumia RTK/surveyor.</div>';
  document.getElementById('panel').innerHTML=h;
}
// GPS IMARA: inachukua visomo vingi, inashika chenye USAHIHI BORA, inasubiri fix nzuri.
let gpsWatch=null;
function captureGps(){
  if(!navigator.geolocation){ renderGps('GPS haipatikani kwenye kifaa/browser hii. Tumia app ya Android.'); return; }
  if(gpsWatch!=null){ return; }  // tayari inasoma
  let best=null, n=0; const TARGET=8, MAXMS=10000, t0=Date.now();
  renderGps('📡 Inasoma GPS… simama TULI. Inasubiri usahihi mzuri (±'+TARGET+' m).');
  function finish(){
    if(gpsWatch!=null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; }
    if(!best){ renderGps('❌ GPS haikupata nafasi. Nenda eneo wazi (nje), ruhusu location, jaribu tena.'); return; }
    aoiPts.push([best.lat,best.lon]); gpsAcc.push(best.acc); redrawAoi();
    map.setView([best.lat,best.lon], Math.max(map.getZoom(),17));
    const q = best.acc<=TARGET ? 'NZURI' : 'ya wastani';
    renderGps('✓ Kona '+aoiPts.length+' imerekodiwa — usahihi '+q+' ±'+Math.round(best.acc)+' m (kutoka visomo '+n+').');
  }
  gpsWatch=navigator.geolocation.watchPosition(
    pos=>{ const c=pos.coords; n++;
      if(!best || (c.accuracy||9999) < best.acc) best={lat:c.latitude,lon:c.longitude,acc:c.accuracy||9999};
      renderGps('📡 Inasoma… visomo '+n+', usahihi bora ±'+Math.round(best.acc)+' m. (Endelea kusimama tuli)');
      if(best.acc<=TARGET || Date.now()-t0>MAXMS) finish();
    },
    err=>{ if(gpsWatch!=null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;}
      renderGps('❌ GPS imeshindwa: '+err.message+'. Ruhusu location. (Browser inahitaji HTTPS; vinginevyo tumia app ya Android.)'); },
    {enableHighAccuracy:true,timeout:MAXMS,maximumAge:0});
  setTimeout(()=>{ if(gpsWatch!=null) finish(); }, MAXMS+800);
}
function undoGps(){ if(aoiPts.length){ aoiPts.pop(); gpsAcc.pop(); redrawAoi(); renderGps(aoiPts.length? 'Kona ya mwisho imefutwa.':'Zimefutwa zote.'); } }
map.on('click', e=>{ if(mode==='measure' && clickToAdd){ aoiPts.push([e.latlng.lat,e.latlng.lng]); redrawAoi(); if(aoiPts.length>=3) analyze(); } });

function openCoords(){ document.getElementById('coordinp').value=''; document.getElementById('coordbox').style.display='flex'; }
function applyCoords(){
  const sc=parseScalars(document.getElementById('coordinp').value); const pts=[];
  for(let i=0;i+1<sc.length;i+=2) pts.push([sc[i],sc[i+1]]);
  document.getElementById('coordbox').style.display='none';
  if(pts.length<3){ alert('Point pungufu (3+ zinahitajika)'); return; }
  aoiPts=pts; redrawAoi(); const b=L.polygon(pts).getBounds(); map.fitBounds(b,{padding:[50,50]}); analyze();
}

// ---------- HIFADHI YA BACKEND (database) + Historia (sidebar) ----------
// API base: ikihudumiwa na backend (http/https) -> origin; vinginevyo weka anwani ya
// server (LAN) kwenye localStorage 'geo_api'. Bila backend -> hifadhi ya ndani (offline).
const API_BASE = (location.protocol.startsWith('http') ? location.origin : (localStorage.getItem('geo_api')||''));
const LS_KEY='geologist_records_v1';
let backendUp=false;
function getLocal(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return [];} }
function setLocal(a){ try{localStorage.setItem(LS_KEY,JSON.stringify(a));return true;}catch(e){return false;} }
async function apiTry(){
  if(!API_BASE){ backendUp=false; return false; }
  try{ const r=await fetch(API_BASE+'/api/health',{cache:'no-store'}); backendUp=r.ok; }catch(e){ backendUp=false; }
  return backendUp;
}
async function saveCurrent(){
  if(aoiPts.length<3){ alert('Weka pembe 3+ kwanza.'); return; }
  const r=areaPerim(aoiPts);
  const clat=aoiPts.reduce((s,p)=>s+p[0],0)/aoiPts.length, clon=aoiPts.reduce((s,p)=>s+p[1],0)/aoiPts.length;
  const g=commoditiesAt(clat,clon);
  const name=prompt('Jina la eneo (mfano: Shamba la Juma):','Eneo '+new Date().toLocaleDateString());
  if(name===null) return;
  const accs=gpsAcc.filter(x=>x);
  const acc = accs.length ? Math.round(accs.reduce((s,x)=>s+x,0)/accs.length) : null;
  const body={ name:name||'Eneo', points:aoiPts.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]),
    method:(mode==='gps'?'gps':'manual'), commodities:g.commod, accuracy_m:acc };
  await apiTry();
  if(backendUp){
    try{
      const res=await fetch(API_BASE+'/api/surveys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok) throw 0;
      const rec=await res.json();
      alert('✓ Imehifadhiwa BACKEND: '+rec.name+' ('+rec.area_ha+' ha).');
      renderSidebar(); toggleSidebar(true); return;
    }catch(e){ /* anguka kwa offline */ }
  }
  const rec={ id:'loc_'+Date.now(), ...body, area_ha:+(r.area/10000).toFixed(4),
    acres:+(r.area/4046.8564224).toFixed(3), perim_km:+(r.perim/1000).toFixed(4),
    date:new Date().toISOString(), _pending:true };
  const arr=getLocal(); arr.unshift(rec); setLocal(arr);
  alert('✓ Imehifadhiwa (OFFLINE): '+rec.name+'. Itasync backend ikipatikana.');
  renderSidebar(); toggleSidebar(true);
}
async function loadRecords(){
  await apiTry();
  if(backendUp){
    try{ const r=await fetch(API_BASE+'/api/surveys'); if(r.ok){ const d=await r.json();
      return d.map(x=>({id:x.id,name:x.name,area_ha:x.area_ha,acres:+(x.area_m2/4046.8564224).toFixed(3),
        perim_km:+(x.perimeter_m/1000).toFixed(4),commodities:x.commodities,points:x.points,date:x.created_at,src:'backend'})); } }
    catch(e){}
  }
  return getLocal().map(x=>({...x,src:'local'}));
}
let sidebarOpen=false;
function toggleSidebar(force){ sidebarOpen=(force===undefined)?!sidebarOpen:force;
  document.getElementById('sidebar').classList.toggle('open',sidebarOpen);
  if(sidebarOpen) renderSidebar(); }
async function renderSidebar(){
  const status=document.getElementById('sbstatus'), list=document.getElementById('sblist');
  status.innerHTML='Inapakia…'; list.innerHTML='';
  const recs=await loadRecords();
  status.innerHTML = backendUp
    ? '<span style="color:#3d6b39;font-weight:700">● Backend hai</span> — kumbukumbu '+recs.length
    : '<span style="color:#B3261E;font-weight:700">● Offline</span> — hifadhi ya ndani ('+recs.length+'). Weka server au fungua kupitia backend.';
  if(!recs.length){ list.innerHTML='<div style="font-size:.82rem;color:#666;padding:10px 0">Bado hakuna. Pima eneo (📐 au 🚶) kisha bonyeza «💾 Hifadhi».</div>'; return; }
  list.innerHTML=recs.map(r=>'<div class="sbitem"><div class="nm">'+r.name+' <span style="color:var(--accent)">'+r.area_ha+' ha</span>'+
    (r.src==='local'?' <span style="color:#B3261E;font-size:.62rem">(offline)</span>':'')+'</div>'+
    '<div class="mt">'+(r.commodities||[]).slice(0,3).join(', ')+' · '+new Date(r.date).toLocaleDateString()+'</div>'+
    '<span class="pill" style="background:#3d6b39" onclick="viewRec(\''+r.id+'\')">Ona ramani</span>'+
    '<span class="pill" style="background:#B3261E" onclick="delRec(\''+r.id+'\',\''+r.src+'\')">Futa</span></div>').join('')+
    '<div style="margin-top:10px"><span class="pill" style="background:#1560d8;padding:5px 10px;cursor:pointer" onclick="exportRecords()">⬇️ Pakua JSON</span></div>';
}
async function viewRec(id){
  const recs=await loadRecords(); const r=recs.find(x=>String(x.id)===String(id)); if(!r)return;
  aoiPts=r.points.map(p=>[p[0],p[1]]); gpsAcc=[]; redrawAoi();
  try{ map.fitBounds(L.polygon(aoiPts).getBounds(),{padding:[50,50]}); }catch(e){}
  toggleSidebar(false);
  document.getElementById('panel').innerHTML='<h4>📋 '+r.name+'</h4><div class="big">'+r.area_ha+' ha</div>'+
    '<div style="font-size:.8rem">'+r.acres+' acres · '+r.perim_km+' km mzunguko</div>'+
    '<div style="font-size:.78rem;margin-top:4px"><b>Madini:</b> '+(r.commodities||[]).join(', ')+'</div>'+
    '<div style="font-size:.72rem;color:#555;margin-top:2px">'+new Date(r.date).toLocaleString()+' · pembe '+r.points.length+'</div>';
}
async function delRec(id,src){
  if(!confirm('Futa kumbukumbu hii?'))return;
  if(src==='backend' && backendUp){ try{ await fetch(API_BASE+'/api/surveys/'+id,{method:'DELETE'}); }catch(e){} }
  else { setLocal(getLocal().filter(x=>String(x.id)!==String(id))); }
  renderSidebar();
}
function exportRecords(){ loadRecords().then(recs=>{
  const blob=new Blob([JSON.stringify(recs,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='geologist_kumbukumbu.json';
  document.body.appendChild(a); a.click(); a.remove(); }); }

// ---------- UI ----------
function buildCtx(){
  const ctx=document.getElementById('ctx');
  if(mode==='view'){
    ctx.innerHTML=VIEW_REGIONS.map(r=>'<button class="'+(r===region?'on':'')+'" onclick="setRegion(\''+r+'\')">'+LABELS[r]+'</button>').join('');
    document.getElementById('legend').style.display='block';
    document.getElementById('legend').innerHTML='<div style="font-weight:700;color:var(--accent);margin-bottom:3px">Uwezekano</div>'+
      '<div><span class="dot" style="background:#B3261E"></span>&ge;90%</div><div><span class="dot" style="background:#E4761B"></span>85–90%</div><div><span class="dot" style="background:#3d6b39"></span>&lt;85%</div>';
  } else if(mode==='measure'){
    ctx.innerHTML='<button class="'+(clickToAdd?'on':'')+'" onclick="toggleClick()">✏️ Weka pembe: '+(clickToAdd?'ON':'OFF')+'</button>'+
      '<button onclick="openCoords()">⌨️ Andika coords</button>'+
      '<button class="act" onclick="analyze()">⛏️ Chunguza</button>'+
      '<button class="danger" onclick="clearAoi()">Futa</button>';
    document.getElementById('legend').style.display='none';
  } else {  // gps
    ctx.innerHTML='<button class="act" onclick="captureGps()">📍 Rekodi kona hapa</button>'+
      '<button onclick="undoGps()">↩ Futa ya mwisho</button>'+
      '<button class="danger" onclick="clearAoi()">Anza upya</button>';
    document.getElementById('legend').style.display='none';
  }
}
function toggleClick(){ clickToAdd=!clickToAdd; buildCtx(); }
function setMode(m){
  mode=m;
  document.getElementById('mView').classList.toggle('on',m==='view');
  document.getElementById('mMeas').classList.toggle('on',m==='measure');
  document.getElementById('mGps').classList.toggle('on',m==='gps');
  if(m==='view'){ aoiLayer.clearLayers(); clickToAdd=false; buildCtx(); renderView(); }
  else { dataLayer.clearLayers(); if(heat){heat.remove();heat=null;} aoiPts=[]; gpsAcc=[]; aoiLayer.clearLayers(); buildCtx();
    if(m==='gps') renderGps('Simama kwenye kona ya kwanza, bonyeza «📍 Rekodi kona hapa».');
    else document.getElementById('panel').innerHTML='<h4>📐 Pima &amp; Chunguza</h4><div style="font-size:.8rem;color:#555">Bonyeza «✏️ Weka pembe» kisha gusa ramani, au «Andika coords».</div>';
  }
}

// anza
buildCtx(); renderView();
</script>
